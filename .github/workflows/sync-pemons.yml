name: Sync Pemon data

on:
  schedule:
    - cron: '3 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-pemons
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: .sync-state
          key: pemon-cursor-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pemon-cursor-
      - name: Update data
        env:
          RL_MIN_INTERVAL: '5'
        run: python scripts/sync_pemons.py
      - name: Commit and push changes
        shell: bash
        run: |
          git add src/assets/pemons.json src/assets/pemon_ids.txt
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync platformer demon data"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
      - uses: actions/cache/save@v4
        with:
          path: .sync-state
          key: pemon-cursor-${{ github.run_id }}-${{ github.run_attempt }}
